<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      // Componente 1: Título
      function Header() {
        return <h1>Develop. Preview. Ship.</h1>;
      }

      // Componente 2: Página principal (que chama o Header)
      function HomePage() {
        return (
          <div>
            <Header />
          </div>
        );
      }

      // Renderiza a HomePage na tela
      const domNode = document.getElementById('app');
      const root = createRoot(domNode);
      root.render(<HomePage />);
    </script>
  </body>
</html>
